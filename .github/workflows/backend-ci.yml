
name: Backend CI

on:
  pull_request:
    branches:
      - dev
      - qa
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

permissions:
  contents: read

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-latest

    steps:
      - name: Validate source and target branches
        env:
          SOURCE: ${{ github.head_ref }}
          TARGET: ${{ github.base_ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          echo "Source: $SOURCE"
          echo "Target: $TARGET"

          if [[ "$SOURCE_REPO" != "$TARGET_REPO" ]]; then
            echo "::error::Fork PRs are not permitted"
            exit 1
          fi

          case "$TARGET" in
            dev)
              if [[ "$SOURCE" != feature/* ]]; then
                echo "::error::Only feature/* can merge to dev"
                exit 1
              fi
              ;;
            qa)
              if [[ "$SOURCE" != "dev" ]]; then
                echo "::error::Only dev can merge to qa"
                exit 1
              fi
              ;;
            main)
              if [[ "$SOURCE" != "qa" ]]; then
                echo "::error::Only qa can merge to main"
                exit 1
              fi
              ;;
            *)
              echo "::error::Invalid target branch"
              exit 1
              ;;
          esac

          echo "Branch policy passed"

  backend-ci:
    name: backend-ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and run tests
        run: mvn -B verify
