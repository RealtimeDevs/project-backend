
# ==========================================
# Application
# ==========================================
spring.application.name=dummydev

server.port=${PORT:8080}

# ==========================================
# Local Environment File
# ==========================================
spring.config.import=optional:file:./.env[.properties]

# ==========================================
# PostgreSQL
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# Spring Data JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ==========================================
# Flyway
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==========================================
# Clerk configuration
# ==========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://fine-treefrog-1353.clerk.accounts.dev
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://fine-treefrog-1353.clerk.accounts.dev/.well-known/jwks.json

app.security.authorized-party=http://localhost:3000

# ==========================================
# CORS
# ==========================================
app.cors.allowed-origin=http://localhost:3000