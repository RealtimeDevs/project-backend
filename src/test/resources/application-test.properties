
# ==========================================
# Application - Test Environment
# ==========================================
spring.application.name=dummydev-test

server.port=0

# ==========================================
# PostgreSQL - Test Database
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# Spring Data JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ==========================================
# Flyway
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==========================================
# Clerk - Test Configuration
# ==========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://test.invalid
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://test.invalid/.well-known/jwks.json

app.security.authorized-party=http://localhost:3000

# ==========================================
# CORS - Test Configuration
# ==========================================
app.cors.allowed-origin=http://localhost:3000
